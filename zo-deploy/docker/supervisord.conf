[supervisord]
nodaemon=true
user=root
loglevel=info

# --- virtual display ---
[program:xvfb]
command=Xvfb :99 -screen 0 1440x900x24 -ac +extension RANDR
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# --- VNC server on the virtual display (password file written at boot) ---
[program:x11vnc]
command=x11vnc -display :99 -forever -shared -rfbport 5900 -rfbauth /data/vnc.passwd -noxdamage
autorestart=true
startsecs=2
startretries=30
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# --- headed Chromium with CDP on loopback:9222, persistent profile ---
[program:chromium]
command=chromium --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 --user-data-dir=/data/chrome-profile --profile-directory=Default --no-first-run --no-default-browser-check --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=1440,900 https://www.linkedin.com/feed/
environment=DISPLAY=":99"
autorestart=true
startsecs=2
startretries=30
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# --- noVNC web client + websocket bridge (internal :6080) ---
[program:novnc]
command=websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
autorestart=true
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# --- scraper HTTP API (internal :6090); inherits MONGODB_URI etc. from container env ---
[program:scraper]
command=node /app/zo-deploy/server.mjs
directory=/app
environment=PORT="6090",CHROME_CDP_URL="http://127.0.0.1:9222"
autorestart=true
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# --- public entrypoint: nginx path-routes / -> noVNC, /run + /health -> scraper ---
[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=50
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
