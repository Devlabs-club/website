name: Secret scan

on:
  push:
  pull_request:

jobs:
  hardcoded-mongo-uris:
    name: No hardcoded MongoDB URIs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests
        run: node --test scripts/check-no-hardcoded-secrets.test.mjs
      - name: Scan tracked files
        run: node scripts/check-no-hardcoded-secrets.mjs
