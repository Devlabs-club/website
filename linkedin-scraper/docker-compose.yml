# Local test / VPS deploy. Single public port (nginx). Persistent volume for the
# logged-in Chrome profile. Reads secrets from linkedin-scraper/.env (gitignored).
#
#   cd linkedin-scraper && docker compose up --build
#   open http://localhost:8080/vnc.html   (password = VNC_PASSWORD)
services:
  enrich-scraper:
    build:
      context: ..                       # repo root
      dockerfile: linkedin-scraper/Dockerfile
    env_file: .env                       # MONGODB_URI, GITHUB_TOKEN, LINKEDIN_SCRAPER_SECRET, VNC_PASSWORD
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - chrome-data:/data
    shm_size: "1gb"                       # Chromium needs more than the default 64m
    restart: unless-stopped

volumes:
  chrome-data:
